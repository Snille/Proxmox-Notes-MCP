# Local development build: docker compose -f compose.dev.yaml up -d --build
# DEV_DATA_DIR holds options.json and targets.json; DEV_SECRETS_DIR holds the token files
# that targets.json points to under /run/secrets/proxmox-notes. Both default to private/ (ignored by git).
services:
  proxmox-notes:
    build: .
    image: proxmox-notes:dev
    container_name: proxmox-notes-dev
    ports:
      - "8085:8080"
    volumes:
      - ${DEV_DATA_DIR:-./private/dev-data}:/data
      - ${DEV_SECRETS_DIR:-./private/secrets}:/run/secrets/proxmox-notes:ro
